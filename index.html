<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON Editor &middot; Event Modeling</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Applies the saved theme before paint to avoid a flash of the wrong theme. -->
  <script src="theme.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>JSON Editor</h1>
    <div class="actions">
      <div class="session-group">
        <select id="sessionSelect" title="Switch session" aria-label="Active session"></select>
        <button id="newSessionBtn" type="button" title="New session">New</button>
        <button id="renameSessionBtn" type="button" title="Rename session">Rename</button>
        <button id="deleteSessionBtn" type="button" title="Delete session">Delete</button>
      </div>
      <span class="schema-badge" title="Validating against the Event Modeling schema">Event Modeling schema</span>
      <button id="formatBtn" type="button" title="Pretty-print (Ctrl/Cmd+S)">Format</button>
      <button id="clearBtn" type="button">Clear</button>
      <button id="downloadBtn" type="button" title="Download session as JSON">Download</button>
      <button id="themeToggle" type="button" title="Theme" aria-label="Theme"></button>
    </div>
  </header>

  <main class="editor-wrap">
    <div class="editor" id="editor">
      <div class="gutter" id="gutter" aria-hidden="true"></div>
      <div class="input-stack">
        <pre class="highlight" id="highlight" aria-hidden="true"></pre>
        <textarea id="input" spellcheck="false" autocomplete="off"
          autocapitalize="off" wrap="off"
          placeholder="Paste or write JSON here&hellip;"></textarea>
      </div>
    </div>
    <aside class="preview" id="preview" aria-label="Model preview"></aside>
  </main>

  <footer class="statusbar" id="statusbar">
    <span class="status-dot" id="statusDot"></span>
    <span class="status-text" id="statusText">Empty</span>
    <span class="status-meta" id="statusMeta"></span>
  </footer>

  <section class="problems" id="problems" hidden>
    <ul id="problemsList"></ul>
  </section>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-head">
        <span class="modal-title" id="modalTitle"></span>
        <button class="modal-close" id="modalClose" type="button" aria-label="Close">&times;</button>
      </header>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="formBackdrop" hidden>
    <form class="modal" id="addForm" role="dialog" aria-modal="true" aria-labelledby="formTitle">
      <header class="modal-head">
        <span class="modal-title" id="formTitle"></span>
        <button class="modal-close" id="formClose" type="button" aria-label="Close">&times;</button>
      </header>
      <div class="modal-body form-body" id="formBody"></div>
      <footer class="modal-foot">
        <span class="form-error" id="formError"></span>
        <button type="button" id="formCancel" class="btn-secondary">Cancel</button>
        <button type="submit" class="btn-primary">Add</button>
      </footer>
    </form>
  </div>

  <script src="schema.js"></script>
  <script src="sessions.js"></script>
  <script src="forms.js"></script>
  <script src="app.js"></script>
</body>
</html>
